<!DOCTYPE html>
<html>
<head>
    <title>Portfolio - Akhil Basthati</title>
    <link rel="stylesheet" href="static/style.css">

    <style>
        body {
            color: white;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(56,189,248,0.25), transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(14,165,233,0.18), transparent 65%);
            filter: blur(90px);
            z-index: -1;
            animation: glowMove 10s infinite alternate ease-in-out;
        }

        @keyframes glowMove {
            from { transform: scale(1); }
            to { transform: scale(1.3); }
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 20px 10%;
            align-items: center;
        }

        nav a {
            color: white;
            margin-left: 18px;
            text-decoration: none;
            transition: 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 100px 10%;
            min-height: 90vh;
        }

        .hero-text h1 {
            font-size: 48px;
            font-weight: 700;
            color: white;
        }

        .hero-text span {
            color: #38bdf8;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .resume-btn, .work-btn {
            padding: 12px 26px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .resume-btn {
            border: 2px solid #38bdf8;
            color: #38bdf8;
        }

        .resume-btn:hover {
            background: #38bdf8;
            color: white;
        }

        .work-btn {
            background: #38bdf8;
            color: white;
        }

        .work-btn:hover {
            background: #0ea5e9;
        }

        .hero-img img {
            width: 330px;
        }
    </style>
</head>

<body>

<div class="bg-glow"></div>

<nav>
    <h2 class="logo">AKHIL BASTHATI</h2>
    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<section class="hero">

    <div class="hero-text">
        <h1>Hello, I'm <span>Akhil Basthati</span></h1>
        <p>A passionate student learning programming, data science, and web development.</p>

        <div class="button-group">
            <a href="static/resume/resumeakhil.pdf" class="resume-btn" download>Download Resume</a>
            <a href="projects.html" class="work-btn">View My Work →</a>
        </div>
    </div>

    <div class="hero-img">
        <img src="https://cdn-icons-png.flaticon.com/512/2920/2920277.png">
    </div>

</section>

</body>
</html>
